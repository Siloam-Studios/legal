<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siloam Studios Legal</title>
<meta name="description" content="Privacy policies and legal documents for Siloam Studios games.">
<style>
  :root { --ink: #2B2236; --muted: #6E6480; --line: #ECE6F0; --card: #FFFFFF; --bg: #FAF7F4; --link: #2F6FD6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(26px, 6vw, 36px); margin: 0 0 8px; }
  .intro { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  ul.games { list-style: none; margin: 0; padding: 0; }
  .game {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px;
  }
  .game img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .game h3 { margin: 0 0 4px; font-size: 18px; }
  .game a { color: var(--link); font-weight: 600; text-underline-offset: 3px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Siloam Studios — Legal Documents</h1>
  <p class="intro">Privacy policies and other legal documents for the games published by Siloam Studios. Each game has its own documents.</p>
  <h2>Our games</h2>
  <ul class="games">
    <li class="game">
      <img src="colorly/privacy/icon.png" alt="" width="56" height="56">
      <div>
        <h3>Colorly: Swipe to Color</h3>
        <a href="colorly/privacy/">Privacy Policy</a>
      </div>
    </li>
  </ul>
  <footer>© 2026 Siloam Studios</footer>
</main>
</body>
</html>
